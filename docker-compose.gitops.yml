services:
  scanner-web:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8074:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./style.css:/usr/share/nginx/html/style.css:ro
      - ./app.js:/usr/share/nginx/html/app.js:ro
      - ./cv-pipeline.js:/usr/share/nginx/html/cv-pipeline.js:ro
      - ./manifest.webmanifest:/usr/share/nginx/html/manifest.webmanifest:ro
      - ./sw.js:/usr/share/nginx/html/sw.js:ro
      - ./icons:/usr/share/nginx/html/icons:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    profiles: ["tunnel"]
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - scanner-web
