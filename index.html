<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111410" />
    <meta name="description" content="A fast, private document scanner that works in your browser." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <link rel="stylesheet" href="/style.css" />
    <title>OpDiScan</title>
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">PRIVATE · ON DEVICE</p>
          <h1>OpDiScan</h1>
        </div>
        <button class="icon-button" id="installButton" type="button" hidden aria-label="Install app" title="Install app">↓</button>
      </header>

      <section class="scanner-card" aria-label="Document scanner">
        <div class="camera-stage" id="cameraStage">
          <video id="camera" playsinline muted aria-label="Camera preview"></video>
          <canvas id="overlay" aria-hidden="true"></canvas>
          <div class="camera-placeholder" id="cameraPlaceholder">
            <div class="document-glyph" aria-hidden="true"></div>
            <h2>Scan a document</h2>
            <p>Line up the page and we’ll find its edges.</p>
          </div>
          <div class="status-pill" id="statusPill" role="status">Camera is off</div>
        </div>

        <div class="camera-controls">
          <button class="secondary-button" id="cameraButton" type="button">Start camera</button>
          <button class="capture-button" id="captureButton" type="button" disabled aria-label="Capture document">
            <span></span>
          </button>
          <label class="secondary-button file-button" for="fileInput">Import</label>
          <input id="fileInput" type="file" accept="image/*" capture="environment" hidden />
        </div>
      </section>

      <section class="workspace" id="workspace" hidden>
        <div class="section-heading">
          <div>
            <p class="eyebrow">CURRENT SCAN</p>
            <h2>Review & export</h2>
          </div>
          <span class="page-count" id="pageCount">1 page</span>
        </div>

        <div class="preview-wrap">
          <canvas id="preview" aria-label="Scanned document preview"></canvas>
        </div>

        <div class="filter-row" role="group" aria-label="Image filter">
          <button class="chip active" type="button" data-filter="color">Color</button>
          <button class="chip" type="button" data-filter="gray">Grayscale</button>
          <button class="chip" type="button" data-filter="bw">B&amp;W</button>
        </div>

        <div class="page-strip" id="pageStrip" aria-label="Scanned pages"></div>

        <div class="export-grid">
          <button class="primary-button" id="addPageButton" type="button">＋ Add page</button>
          <button class="primary-button accent" id="pdfButton" type="button">Export PDF</button>
          <button class="text-button" id="jpgButton" type="button">Download JPG</button>
          <button class="text-button" id="pngButton" type="button">Download PNG</button>
          <button class="text-button danger" id="deleteButton" type="button">Delete page</button>
        </div>
      </section>
    </main>

    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://docs.opencv.org/4.x/opencv.js" async></script>
    <script src="https://cdn.jsdelivr.net/npm/jspdf@2.5.2/dist/jspdf.umd.min.js" defer></script>
    <script type="module" src="/app.js"></script>
  </body>
</html>
